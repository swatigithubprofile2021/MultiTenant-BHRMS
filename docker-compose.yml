version: "3.8"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: pass33d
      POSTGRES_DB: bbotdb
    volumes:
      - pgdata:/data

  web:
    image: python:3.13-slim
    container_name: bbot_web
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/bbotdb
      - SYNC_DATABASE_URL=postgresql://postgres:password@db:5432/bbotdb
    depends_on:
      - redis
      - db
    command: bash -c "pip install --no-cache-dir -e . && uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2 --loop=asyncio"
    ports:
      - "8001:8001"

  celery:
    image: python:3.13-slim
    container_name: bbot_celery
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - web
    command: bash -c "pip install --no-cache-dir -e . && celery -A app.tasks.celery_task.celery_app worker --loglevel=info --concurrency=4 -P gevent"

  flower:
    image: python:3.13-slim
    container_name: bbot_flower
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: bash -c "pip install --no-cache-dir -e . && celery -A app.tasks.celery_task.celery_app flower --port=5555"
    ports:
      - "5555:5555"

volumes:
  redis_data:
  pgdata:
