[project]
name = "bhrms-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "celery>=5.6.2",
    "chromadb>=1.4.1",
    "docling>=2.73.0",
    "fastapi[all]>=0.128.0",
    "flower>=2.0.1",
    "gevent>=25.9.1",
    "langchain>=1.2.8",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-redis>=0.2.5",
    "llama-index>=0.14.13",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-llms-langchain>=0.7.1",
    "llama-index-llms-ollama>=0.9.1",
    "llama-index-vector-stores-chroma>=0.5.5",
    "llama-index-vector-stores-postgres>=0.7.3",
    "nest-asyncio>=1.6.0",
    "prometheus-client>=0.24.1",
    "pyjwt>=2.11.0",
    "pymupdf>=1.26.7",
    "pymupdf4llm>=0.2.9",
    "pypdf>=6.6.2",
    "python-multipart>=0.0.22",
    "redis>=7.1.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-order>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
